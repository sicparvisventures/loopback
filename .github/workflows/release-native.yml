name: Release macOS app

# Publishes the downloadable Loopback.app.
#
# Tag a release to ship one:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Or run the workflow manually with a version to cut an ad-hoc build.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0 (creates tag v<version>)"
        required: true
        type: string

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Select the newest Xcode
        # supabase-swift needs swift-tools-version 6.1, and older toolchains
        # silently drop its Realtime target during a universal build, which
        # surfaces much later as "no such module 'Realtime'".
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: native/Loopback/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('native/Loopback/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # Bake credentials into Info.plist when the secrets exist, so a downloaded
      # build is connected out of the box. Without them the app still ships and
      # asks for the project URL and anon key in Settings.
      - name: Inject Supabase credentials
        if: ${{ vars.SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          PLIST=native/Loopback/Loopback/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Add :SupabaseURL string $SUPABASE_URL" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :SupabaseAnonKey string $SUPABASE_ANON_KEY" "$PLIST"

      - name: Build Loopback.app
        run: ./scripts/build-app.sh "${{ steps.version.outputs.version }}"

      - name: Verify the bundle
        run: |
          APP=dist/Loopback.app
          test -x "$APP/Contents/MacOS/Loopback"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/Loopback"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 *.zip | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Loopback ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/Loopback-${{ steps.version.outputs.version }}-macos-universal.zip
            dist/SHA256SUMS.txt
          body: |
            ## Install

            **One-liner** (no Gatekeeper prompt — curl does not set the quarantine flag):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```

            **Manual download**: grab `Loopback-${{ steps.version.outputs.version }}-macos-universal.zip`
            below, unzip, and drag `Loopback.app` to Applications. Because the build
            is ad-hoc signed rather than notarised, macOS will block the first launch
            — right-click the app and choose **Open**, or run:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Loopback.app
            ```

            Universal binary (Apple Silicon + Intel). Requires macOS 14 or later.
            Verify your download against `SHA256SUMS.txt`.
